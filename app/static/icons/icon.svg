<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Full bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Subtle radial highlight -->
  <circle cx="170" cy="140" r="180" fill="#ffffff" opacity="0.08" />

  <!-- Open Book (centered inside maskable 80% safe zone) -->
  <g transform="translate(0, 22)">
    <!-- Left page -->
    <path d="M256 205 C220 185, 165 182, 118 194 C108 196, 102 204, 102 214 L102 356 C102 367, 111 375, 122 373 C166 364, 218 368, 256 388 Z"
          fill="#ffffff" />
    <!-- Right page -->
    <path d="M256 205 C292 185, 347 182, 394 194 C404 196, 410 204, 410 214 L410 356 C410 367, 401 375, 390 373 C346 364, 294 368, 256 388 Z"
          fill="#eef2ff" />
    <!-- Center spine shadow -->
    <path d="M256 205 L256 388" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round" />

    <!-- Stylized text lines on left page -->
    <line x1="138" y1="242" x2="222" y2="250" stroke="#a5b4fc" stroke-width="11" stroke-linecap="round" />
    <line x1="138" y1="278" x2="222" y2="286" stroke="#c7d2fe" stroke-width="11" stroke-linecap="round" />
    <line x1="138" y1="314" x2="200" y2="320" stroke="#c7d2fe" stroke-width="11" stroke-linecap="round" />

    <!-- Stylized text lines on right page -->
    <line x1="290" y1="250" x2="374" y2="242" stroke="#a5b4fc" stroke-width="11" stroke-linecap="round" />
    <line x1="290" y1="286" x2="374" y2="278" stroke="#c7d2fe" stroke-width="11" stroke-linecap="round" />
    <line x1="312" y1="320" x2="374" y2="314" stroke="#c7d2fe" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- Golden learning star above book -->
  <path d="M256 76 L271 116 L314 118 L280 144 L292 184 L256 161 L220 184 L232 144 L198 118 L241 116 Z"
        fill="url(#star)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
</svg>
